name: Deploy AI service

# The web app deploys through Vercel's own Git integration. This workflow is
# only the FastAPI service, which had no automated deploy at all — it was
# `gcloud run deploy` by hand.
on:
  push:
    branches: [main]
    paths:
      - 'apps/ai/**'
      - 'packages/shared/pricing.json'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ai
  cancel-in-progress: false # never interrupt a deploy mid-flight

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: chatgrp-ai-prod
  REGION: us-central1
  SERVICE: chatgrp-ai
  REPOSITORY: chatgrp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Workload Identity Federation, not a service-account JSON key: GitHub
      # mints a short-lived token per run, so there is no long-lived credential
      # to leak or rotate.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Tagged with the commit SHA so a rollback names an exact revision.
      # Built from the repo root (see the root .dockerignore) so the image can
      # include packages/shared/pricing.json alongside apps/ai.
      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -f apps/ai/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          # Env vars and secrets are NOT set here: Cloud Run carries the previous
          # revision's configuration forward on every deploy. Never add
          # --clear-env-vars. The container refuses to start without
          # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (see app/config.py), in
          # which case the health check below fails and the old revision keeps
          # serving. Required set: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
          # WEB_ORIGIN, USE_MOCK_AI, and the provider API keys as secrets.
          # Optional: SENTRY_DSN (error reporting is off without it).
          #
          # Limits live here, not in the console, so a redeploy cannot drop them.
          #   max-instances: the only real cost ceiling Cloud Run has (budgets just
          #                  alert). 1 while testing: ~$65/month if saturated 24/7,
          #                  in practice inside the free tier. One instance serves
          #                  80 concurrent streams. Raise it for launch.
          #   min-instances: 0 = no idle cost, ~3-8 s cold start on the first
          #                  request after idle. Flip to 1 once paying users notice.
          #   timeout:       one SSE stream may run this long; must exceed
          #                  PROVIDER_TIMEOUT_SECONDS so the provider gives up first.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 1 \
            --min-instances 0 \
            --timeout 600 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --quiet
          echo "url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # CI already ran pytest and a boot smoke test on the image; this is the
      # proof that THIS revision is live and serving. A failure here fails the
      # run loudly instead of leaving a dead revision taking traffic.
      - name: Health check
        run: |
          URL="${{ steps.deploy.outputs.url }}/health"
          echo "Probing $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$URL" | tee /tmp/health | grep -q '"ok":true'; then
              echo "Healthy."
              exit 0
            fi
            echo "Attempt $i failed; retrying in 6s"
            sleep 6
          done
          echo "Service did not report healthy. Last response:"
          cat /tmp/health || true
          echo "Roll back with:"
          echo "  gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=PREVIOUS_REVISION=100"
          exit 1

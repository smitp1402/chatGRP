name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight — no point finishing a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files via the API

jobs:
  # Which parts of the monorepo changed. Everything downstream reads these, so a
  # docs-only PR skips both build jobs instead of burning six minutes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            ai:
              - 'apps/ai/**'
              - 'packages/shared/pricing.json'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads `packageManager` from package.json, so CI and local stay in step.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Route-handler unit tests (vitest). Stripe and Supabase are mocked, so
      # no secrets are needed.
      - name: Test
        run: pnpm test

      # Catches what lint and tsc cannot: bad route exports, server/client
      # boundary mistakes, and anything that only fails at build time.
      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders. Real values live in Vercel; these only need
          # to be well-formed so the Supabase client can be constructed.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_AI_URL: http://localhost:8000

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Unit + request-lifecycle tests against an in-memory fake of Supabase
      # (tests/fake_db.py), so no secrets or database are needed. Covers credit
      # reservation/refund, provider-error handling, and cancel ownership.
      - name: Test
        run: python -m pytest

      # The image is built from the repo root with a whitelist .dockerignore.
      # Build it here (no push) so a missing `!` line fails the PR, not the
      # production deploy.
      - name: Docker build smoke
        working-directory: ${{ github.workspace }}
        run: docker build -f apps/ai/Dockerfile -t chatgrp-ai:ci .

      # Boot it too: proves the non-root user can import the app and that the
      # bundled pricing.json is where app/pricing.py expects it. Placeholder
      # Supabase values satisfy the fail-fast config; nothing is contacted.
      - name: Docker run smoke
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            chatgrp-ai:ci \
            sh -c 'test "$(id -u)" = 1000 && python -c "from app.main import app; print(\"boots as uid\", __import__(\"os\").getuid())"'

  # Browser flow against a DEDICATED Supabase project (never production - the
  # service-role key and a password login are exposed to the job) with the AI
  # service in mock mode. Needs E2E_* secrets (see apps/web/e2e/README.md);
  # forks and repos without them skip cleanly instead of failing.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: echo "run=${{ secrets.E2E_SUPABASE_URL != '' && secrets.E2E_DEV_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run != 'true'
        run: echo 'E2E secrets not configured; skipping browser tests.'

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai/requirements.txt

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r apps/ai/requirements.txt
      - if: steps.gate.outputs.run == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - if: steps.gate.outputs.run == 'true'
        name: Browser tests
        run: pnpm test:e2e
        env:
          CI: 'true'
          # web (the AI URL is set by playwright.config.ts, not here)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DEV_EMAIL: ${{ secrets.E2E_DEV_EMAIL }}
          NEXT_PUBLIC_DEV_PASSWORD: ${{ secrets.E2E_DEV_PASSWORD }}
          # ai
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          WEB_ORIGIN: http://localhost:3000
          USE_MOCK_AI: 'true'

      # Screenshots only. Traces/video would include the session cookie.
      - if: steps.gate.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  # Credentials must never reach a commit. Runs on every PR regardless of paths.
  # The upstream gitleaks action gates some accounts behind a license key, so we
  # run the binary directly — same scan, no licensing path.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"             | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Scan history for committed secrets
        run: gitleaks detect --source . --redact --verbose

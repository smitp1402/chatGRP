name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight — no point finishing a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files via the API

jobs:
  # Which parts of the monorepo changed. Everything downstream reads these, so a
  # docs-only PR skips both build jobs instead of burning six minutes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            ai:
              - 'apps/ai/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads `packageManager` from package.json, so CI and local stay in step.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Catches what lint and tsc cannot: bad route exports, server/client
      # boundary mistakes, and anything that only fails at build time.
      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders. Real values live in Vercel; these only need
          # to be well-formed so the Supabase client can be constructed.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_AI_URL: http://localhost:8000

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Unit + request-lifecycle tests against an in-memory fake of Supabase
      # (tests/fake_db.py), so no secrets or database are needed. Covers credit
      # reservation/refund, provider-error handling, and cancel ownership.
      - name: Test
        run: python -m pytest

  # Credentials must never reach a commit. Runs on every PR regardless of paths.
  # The upstream gitleaks action gates some accounts behind a license key, so we
  # run the binary directly — same scan, no licensing path.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"             | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Scan history for committed secrets
        run: gitleaks detect --source . --redact --verbose
